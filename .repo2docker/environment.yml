name: notebook

channels:
  - conda-forge
  - defaults

dependencies:
  # python
  - python=3.12.12
  - numpy=2.4.2

  # modern jupyter interface
  - jupyterlab>=4.0.0
  - notebook>=7.0.0
  - ipykernel

  # plotting stuff
  - matplotlib=3.10.8

  # CPU-only PyTorch from pytorch channel
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - cpuonly

  # pip for additional packages
  - pip=26.0.1
  - pip:
    - tensorly==0.9.0
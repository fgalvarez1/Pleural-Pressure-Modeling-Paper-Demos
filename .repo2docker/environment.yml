name: notebook

channels:
  - conda-forge
  - defaults

dependencies:
# python
  - numpy=2.4.2
  - python=3.12.12

# modern jupyter interface
  - jupyterlab>=4.0.0
  - notebook>=7.0.0
  - ipykernel

# plotting stuff
  - matplotlib=3.10.8

# computing stuff
  - pip=26.0.1
  - pip:
    - torch==2.5.1
    - tensorly==0.9.0